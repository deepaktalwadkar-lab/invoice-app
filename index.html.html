<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settled – invoices for freelancers</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0F3;--panel:#fff;--ink:#14213D;--mute:#5B6678;--line:#D5DAE1;--accent:#1F6F5C;--accent-ink:#fff;--paper:#fff;--stamp:#C23B3B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1420;--panel:#172033;--ink:#E8ECF4;--mute:#97A2B6;--line:#2A3550;--accent:#4FC2A1;--accent-ink:#0E1420;--paper:#F8F9FB;--stamp:#E06A6A}}
:root[data-theme="dark"]{--bg:#0E1420;--panel:#172033;--ink:#E8ECF4;--mute:#97A2B6;--line:#2A3550;--accent:#4FC2A1;--accent-ink:#0E1420;--paper:#F8F9FB;--stamp:#E06A6A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px;flex-wrap:wrap}
h1{font:700 26px 'Bricolage Grotesque',Inter,sans-serif;margin:0;letter-spacing:-.5px}
header p{margin:0;color:var(--mute);font-size:14px}
main{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:20px;padding:0 24px 40px;max-width:1100px;margin:0 auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel h2{font:700 16px 'Bricolage Grotesque',Inter,sans-serif;margin:18px 0 8px}
.panel h2:first-child{margin-top:0}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:grid;grid-template-columns:1fr 54px 80px 28px;gap:6px;margin-bottom:6px}
.item button{padding:0}
button{font:600 14px Inter,sans-serif;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:9px 12px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.setaside{margin-top:14px;padding:12px;border-radius:8px;background:var(--bg);border-left:4px solid var(--accent);font-size:14px}
.setaside b{font:700 20px 'Bricolage Grotesque',Inter,sans-serif;display:block}
.pro{margin-top:14px;padding:12px;border:1px dashed var(--accent);border-radius:8px;font-size:13px}
.pro a{color:var(--accent);font-weight:600}
.pro input{margin-top:6px}
#sheetwrap{overflow-x:auto}
#sheet{background:var(--paper);color:#14213D;border-radius:4px;padding:36px;min-width:520px;position:relative;box-shadow:0 2px 14px rgba(20,33,61,.12)}
#sheet h3{font:700 30px 'Bricolage Grotesque',sans-serif;margin:0 0 4px}
#sheet .meta{display:flex;justify-content:space-between;gap:20px;margin:18px 0;font-size:14px;flex-wrap:wrap}
#sheet table{width:100%;border-collapse:collapse;font-size:14px}
#sheet th{text-align:left;border-bottom:2px solid #14213D;padding:6px 0;font-weight:600}
#sheet td{padding:7px 0;border-bottom:1px solid #D5DAE1}
#sheet .r{text-align:right}
#sheet .tot{margin-left:auto;width:240px;margin-top:14px;font-size:14px}
#sheet .tot div{display:flex;justify-content:space-between;padding:3px 0}
#sheet .tot .g{font:700 20px 'Bricolage Grotesque',sans-serif;border-top:2px solid #14213D;margin-top:4px;padding-top:8px}
#stamp{position:absolute;top:34px;right:36px;border:4px solid var(--stamp);color:var(--stamp);font:700 28px 'Bricolage Grotesque',sans-serif;padding:2px 14px;transform:rotate(-8deg);border-radius:6px;opacity:.85;display:none}
#sheet.paid #stamp{display:block}
#mark{margin-top:28px;font-size:12px;color:#7A8497;text-align:center}
.pre{white-space:pre-line}
@media print{body{background:#fff}header,.panel,.nopr{display:none!important}main{display:block;padding:0}#sheet{box-shadow:none;padding:0}}
</style>
</head>
<body>
<header>
  <div><h1>Settled</h1><p>Send a clean invoice. Know what to set aside for tax.</p></div>
</header>
<main>
<section class="panel nopr" aria-label="Invoice details">
  <h2>You</h2>
  <label for="from">Your name or business</label><input id="from" value="Your Name">
  <label for="fromAddr">Contact (email, address)</label><input id="fromAddr" value="you@email.com">
  <h2>Client</h2>
  <label for="to">Client name</label><input id="to" value="Client Co.">
  <div class="row">
    <div><label for="num">Invoice no.</label><input id="num"></div>
    <div><label for="cur">Currency</label>
      <select id="cur"><option>$</option><option>€</option><option>£</option><option>₹</option><option>A$</option><option>C$</option></select></div>
  </div>
  <div class="row">
    <div><label for="date">Issued</label><input id="date" type="date"></div>
    <div><label for="due">Due</label><input id="due" type="date"></div>
  </div>
  <h2>Work</h2>
  <div id="items"></div>
  <button id="add" type="button">Add line</button>
  <div class="row">
    <div><label for="tax">Sales tax / GST (%)</label><input id="tax" type="number" min="0" value="0"></div>
    <div><label for="aside">Income tax to set aside (%)</label><input id="aside" type="number" min="0" value="25"></div>
  </div>
  <label for="note">Payment note</label><input id="note" value="Please pay by bank transfer within 14 days.">
  <div class="setaside" aria-live="polite">Set this aside for income tax<b id="asideAmt"></b><span id="keepAmt"></span></div>
  <div class="actions">
    <button class="primary" id="print" type="button">Save as PDF</button>
    <button id="paid" type="button">Mark as paid</button>
    <button id="next" type="button">New invoice</button>
  </div>
  <div class="pro" id="proBox">
    <b>Settled Pro</b> removes the footer line from your invoices.
    <a id="buy" href="#" rel="noopener">Get Pro</a>
    <input id="code" placeholder="Enter unlock code" aria-label="Unlock code">
    <span id="proMsg"></span>
  </div>
</section>
<section id="sheetwrap" aria-label="Invoice preview">
  <div id="sheet">
    <div id="stamp">PAID</div>
    <h3>Invoice <span id="vNum"></span></h3>
    <div class="meta">
      <div><b id="vFrom"></b><br><span id="vFromAddr"></span></div>
      <div>Billed to<br><b id="vTo"></b></div>
      <div>Issued <span id="vDate"></span><br>Due <span id="vDue"></span></div>
    </div>
    <table><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody id="vRows"></tbody></table>
    <div class="tot">
      <div><span>Subtotal</span><span id="vSub"></span></div>
      <div><span>Tax</span><span id="vTax"></span></div>
      <div class="g"><span>Total due</span><span id="vTot"></span></div>
    </div>
    <p id="vNote" class="pre"></p>
    <p id="mark">Made with Settled</p>
  </div>
</section>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var KEY='settled.v1', st={n:1,pro:false};
try{var s=localStorage.getItem(KEY);if(s)st=JSON.parse(s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
// Replace this with your real payment link (Stripe Payment Link, Gumroad, Lemon Squeezy)
var PAY_LINK='https://example.com/replace-with-your-payment-link';
// Replace with codes you issue after each sale
var CODES=['SETTLED-PRO-LAUNCH'];
var items=[{d:'Website design',q:1,r:1200},{d:'Revisions',q:3,r:80}];
function today(o){var d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)}
$('date').value=today(0);$('due').value=today(14);$('buy').href=PAY_LINK;
function num(){$('num').value='INV-'+String(st.n).padStart(3,'0')}num();
function money(v){return $('cur').value+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function drawItems(){
  var h='';items.forEach(function(it,i){h+='<div class="item"><input data-i="'+i+'" data-k="d" value="'+esc(it.d).replace(/"/g,'&quot;')+'" aria-label="Description"><input data-i="'+i+'" data-k="q" type="number" min="0" value="'+it.q+'" aria-label="Quantity"><input data-i="'+i+'" data-k="r" type="number" min="0" value="'+it.r+'" aria-label="Rate"><button type="button" data-x="'+i+'" aria-label="Remove line">×</button></div>'});
  $('items').innerHTML=h;
}
function render(){
  var sub=0,rows='';
  items.forEach(function(it){var a=(+it.q||0)*(+it.r||0);sub+=a;rows+='<tr><td>'+esc(it.d)+'</td><td class="r">'+(+it.q||0)+'</td><td class="r">'+money(+it.r||0)+'</td><td class="r">'+money(a)+'</td></tr>'});
  var tax=sub*(+$('tax').value||0)/100,tot=sub+tax,aside=sub*(+$('aside').value||0)/100;
  $('vRows').innerHTML=rows;$('vSub').textContent=money(sub);$('vTax').textContent=money(tax);$('vTot').textContent=money(tot);
  $('vNum').textContent=$('num').value;$('vFrom').textContent=$('from').value;$('vFromAddr').textContent=$('fromAddr').value;
  $('vTo').textContent=$('to').value;$('vDate').textContent=$('date').value;$('vDue').textContent=$('due').value;$('vNote').textContent=$('note').value;
  $('asideAmt').textContent=money(aside);$('keepAmt').textContent='You keep about '+money(sub-aside)+' of this job.';
  $('mark').style.display=st.pro?'none':'block';
  $('proBox').style.display=st.pro?'none':'block';
}
$('items').addEventListener('input',function(e){var t=e.target;if(t.dataset.k){items[t.dataset.i][t.dataset.k]=t.value;render()}});
$('items').addEventListener('click',function(e){var x=e.target.dataset.x;if(x!==undefined){items.splice(+x,1);drawItems();render()}});
$('add').onclick=function(){items.push({d:'',q:1,r:0});drawItems();render()};
['from','fromAddr','to','num','cur','date','due','tax','aside','note'].forEach(function(i){$(i).addEventListener('input',render)});
$('paid').onclick=function(){var s=$('sheet');s.classList.toggle('paid');this.textContent=s.classList.contains('paid')?'Mark as unpaid':'Mark as paid'};
$('print').onclick=function(){window.print()};
$('next').onclick=function(){st.n++;save();num();$('sheet').classList.remove('paid');$('paid').textContent='Mark as paid';render()};
$('code').addEventListener('input',function(){
  var v=this.value.trim().toUpperCase();
  if(CODES.indexOf(v)>-1){st.pro=true;save();render()}
  else $('proMsg').textContent=v?'Code not recognised yet.':'';
});
drawItems();render();
})();
</script>
</body>
</html>
